name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 7 * * 1" # weekly, Monday 07:43 UTC

permissions:
  contents: read

jobs:
  # govulncheck reports only vulnerabilities in code paths this module
  # actually reaches, so a finding here is actionable, not noise.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          go-package: ./...

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.27.1
        with:
          # -no-fail: findings surface in the Security tab via SARIF rather
          # than breaking builds; promote to blocking once triaged.
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."

      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: gosec.sarif
          category: gosec
